<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">  <!-- phones draw at their real size -->
    <title>Cedar Lake | Cole Shanks</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
    <!-- Added to the Home Screen, it opens full screen like an app (on iPhone the only full screen); the
         manifest, which sends it to the title, is added below unless the address stages a scene. -->
    <link rel="apple-touch-icon" href="/assets/cedar-lake/icon-180.png">
    <meta name="apple-mobile-web-app-title" content="Cedar Lake">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="robots" content="noindex">  <!-- the site lists the project's page, which shows this one in a frame -->
    <!-- The web version's page: the 3D view, the HUD over it, a word while it loads, and (on the
         title screen, when the page has somewhere to go back to) a way back. web/deploy.sh copies it
         to the site with the site's own paths. -->
    <style>
        :root {  /* the HUD keeps inside these: clear of a phone's notch, island and rounded corners */
            --safe-left: env(safe-area-inset-left); --safe-top: env(safe-area-inset-top);
            --safe-right: env(safe-area-inset-right); --safe-bottom: env(safe-area-inset-bottom);
        }
        html, body { margin: 0; height: 100%; overflow: hidden; background: #061416; user-select: none; -webkit-user-select: none; }
        #game, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
        #game { outline: none; touch-action: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        #type {  /* a touch screen's text box, for names and typed answers: top middle, clear of the keyboard */
            position: fixed; top: calc(env(safe-area-inset-top) + 12px); left: 50%; transform: translateX(-50%);
            width: min(60vw, 520px); display: none; box-sizing: border-box; z-index: 2;
            font: 500 20px "Cedar Rounded", system-ui, sans-serif; color: #f5ebcf;
            background: rgba(9, 26, 31, .95); border: 2px solid #f0a752; border-radius: 10px; padding: 10px 14px; outline: none;
        }
        #type::placeholder { color: #a9b5ad; }
        #hud { pointer-events: none; }
        .note {
            position: fixed; left: 50%; transform: translateX(-50%);
            font: 500 18px "Cedar Rounded", system-ui, sans-serif; color: #f5ebcf;
            background: rgba(9, 26, 31, .88); border-radius: 10px; padding: 12px 22px;
            pointer-events: none; text-align: center;
        }
        #loading { top: 45%; }
        #hint { top: 58%; display: none; }
        #result { top: 50%; transform: translate(-50%, -50%); white-space: pre-line; line-height: 1.35; font-size: 15px; padding: 10px 18px; }
        #back {
            position: fixed; top: 18px; right: 22px; display: none;
            font: 500 16px "Cedar Rounded", system-ui, sans-serif; color: #f5ebcf; text-decoration: none;
            background: rgba(9, 26, 31, .7); border-radius: 8px; padding: 7px 14px;
        }
        #back:hover { background: rgba(9, 26, 31, .95); }
        body.title:not(.framed) #back[href^="/"] { display: block; }
        @media (display-mode: fullscreen), (display-mode: standalone) {  /* opened from the Home Screen */
            #back { display: none !important; }  /* nowhere to go back to */
            #game, #hud { height: calc(100% + env(safe-area-inset-top)); }  /* 100% starts under the status bar but leaves out its height */
        }
    </style>
</head>
<body>
    <canvas id="game" tabindex="0"></canvas>
    <canvas id="hud"></canvas>
    <input id="type" type="text" placeholder="Tap here to type" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
    <a id="back" href="/projects/cedar-lake.html">← back</a>
    <div id="loading" class="note">Loading Cedar Lake…</div>
    <div id="hint" class="note">Click to look around</div>
    <script>
        'use strict';
        const ASSETS = '/assets/cedar-lake/';  // where the game's files are, from this page (the site's copy points to its own)
        window.CEDAR_ASSETS = ASSETS;
        if (window.self !== window.top) document.body.classList.add('framed');  // in another page's frame: that page has the way back

        // For a phone with no keyboard: ?views=overview,dialogue stages each scene in turn, a tap moving to
        // the next. Staged pages leave out the manifest, so the Home Screen keeps the address as it is.
        const params = new URLSearchParams(location.search);
        if (params.has('views')) {
            const views = params.get('views').split(',');
            const next = view => { params.set('view', view); location.replace('?' + params); };
            if (!params.has('view')) next(views[0]);
            addEventListener('pointerup', () => next(views[(views.indexOf(params.get('view')) + 1) % views.length]));
            // A staged scene stops drawing once it's done, so a turned phone stages it again at the new size.
            const wide = innerWidth > innerHeight;
            addEventListener('resize', () => { if ((innerWidth > innerHeight) !== wide) location.reload(); });
        }
        if (!params.has('view') && !params.has('benchmark')) {
            const manifest = document.createElement('link');
            manifest.rel = 'manifest';
            manifest.href = ASSETS + 'manifest.webmanifest';
            document.head.appendChild(manifest);
        }

        function load(src) {
            return new Promise((done, failed) => {
                const script = document.createElement('script');
                script.src = ASSETS + src;
                script.onload = done;
                script.onerror = failed;
                document.head.appendChild(script);
            });
        }

        const canvas = document.getElementById('game');
        canvas.addEventListener('contextmenu', e => e.preventDefault());  // the right button is the binoculars
        if (!document.createElement('canvas').getContext('webgl2')) {
            document.getElementById('loading').textContent = 'Cedar Lake needs a browser with WebGL 2 (a recent Chrome, Edge, Safari or Firefox).';
        } else {
            var Module = {canvas, locateFile: path => ASSETS + path};
            // The rounded type first, so the first frame's text is in it: Zen Maru Gothic, and M PLUS
            // Rounded 1c for the symbols it lacks.
            const fonts = [['Cedar Rounded', 'rounded', 500], ['Cedar Rounded', 'rounded', 700], ['Cedar Symbols', 'symbols', 500], ['Cedar Symbols', 'symbols', 700]]
                .map(([family, file, weight]) => new FontFace(family, `url(${ASSETS}fonts/${file}-${weight}.woff2)`, {weight: String(weight)}))
                .map(face => face.load().then(loaded => document.fonts.add(loaded)).catch(() => {}));
            Promise.all([...fonts, load('hud.js'), load('audio.js')])
                .then(() => load('cedar.js'))
                .catch(() => { document.getElementById('loading').textContent = 'Cedar Lake could not load. Try reloading the page.'; });
        }
    </script>
</body>
</html>
